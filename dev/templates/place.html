<div class="row" style="align-items:stretch;height:100%">
  <div class="card" style="width:420px">
    <h2>$name</h2><p class="muted">$kind · ★ $stars</p>
    <p>$address</p>
    <p><b>Hours</b><br>$hours</p>
    <p><b>Day pass</b> $price</p>
    $extra
  </div>
  <div style="flex:1;border-radius:10px;background:
    repeating-linear-gradient(35deg,#e8eef3 0 28px,#dfe7ee 28px 30px),#e8eef3"></div>
</div>
