<div class="card" style="max-width:560px;margin:30px auto">
  <div class="row"><div class="avatar" style="background:#0ea5e9">$initials</div><h2>$site</h2></div>
  <p class="muted" style="margin-top:14px">Username</p><p><b>$username</b></p>
  <p class="muted">Password <span style="color:#2563eb">· Hide</span></p>
  <p style="font:600 18px Consolas, monospace">$secret</p>
  <p class="muted">Website</p><p>$url</p>
  <p class="muted">Last changed $issued</p>
  $extra
</div>
