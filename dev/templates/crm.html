<h2>Contacts › $person</h2>
<div class="card" style="max-width:700px;margin-top:12px">
  <div class="row"><div class="avatar">$initials</div><div><b>$person</b><div class="muted">$role, $client</div></div></div>
  <table>
    <tr><td class="muted">Mobile</td><td>$secret</td></tr>
    <tr><td class="muted">Email</td><td>$email</td></tr>
    <tr><td class="muted">Home address</td><td>$address</td></tr>
    <tr><td class="muted">Birthday</td><td>$birthday</td></tr>
    <tr><td class="muted">Notes</td><td>$note</td></tr>
  </table>
  $extra
</div>
